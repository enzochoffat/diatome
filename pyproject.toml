[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "diatome"
version = "0.1.0"
description = "FIBE fishery behavior model - Python implementation"
requires-python = ">=3.8"
dependencies = [
    "mesa>=2.0.0",
    "pandas>=1.5.0",
    "numpy>=1.23.0",
    "matplotlib>=3.6.0",
    "solara>=1.0.0"
]

[tool.setuptools]
packages = ["src"]

[tool.setuptools.package-data]
src = ["**/*.json"]

tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true


[tool.ruff.lint.pydocstyle]
convention = "google"